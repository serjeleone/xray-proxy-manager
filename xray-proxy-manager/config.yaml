name: Xray Proxy Manager
version: "0.9.0"
slug: xray-proxy-manager
image: "ghcr.io/serjeleone/xray-proxy-manager"
description: "Управление Xray через один или два SOCKS5-слота, проверка outbound и безопасное переключение"
url: "https://github.com/serjeleone/xray-proxy-manager"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 0
panel_icon: mdi:server-network
panel_title: Xray Proxy Manager
panel_admin: true
hassio_api: true
hassio_role: default
watchdog: "http://[HOST]:18099/api/health"
backup: hot
map:
  - app_config:rw
options:
  subscription_url: ""
  config_index: 0
  update_interval_hours: 1
  user_agent: "XPM-HA-App"

  dual_slot_enabled: true
  socks_tcp_a: 10808
  socks_tcp_b: 10809
  proxy_username: ""
  proxy_password: ""
  log_level: "warning"

  auto_checker_enabled: true
  auto_switch_best_enabled: true
  switching_preset: "smooth"
  auto_switch_preferred_country: ""
  auto_switch_preferred_protocol: ""
  auto_switch_excluded: "RU"
  auto_switch_min_ping_delta_ms: 100
  auto_check_interval_seconds: 60
  auto_best_check_interval_seconds: 600
  auto_check_max_latency_ms: 500
  auto_check_failures: 3
  auto_check_timeout_seconds: 12
  latency_test_timeout_seconds: 12
  latency_test_parallelism: 0
  primary_test_url: "https://www.gstatic.com/generate_204"
  secondary_test_url: "https://cp.cloudflare.com/generate_204"

  ui_port: 8090
  ui_sort: "ping-asc"
  ui_protocol_filter: "all"
  ui_max_ping_ms: 1000
  ui_hide_unavailable: false
  ui_hide_excluded: true

  selector_control_enabled: false
  selector_api_url: "http://192.168.0.1:9090"
  selector_api_secret: ""
  selector_tag: "xray-active"
  selector_status_interval_seconds: 10
  drain_quiet_seconds: 30
  drain_poll_interval_seconds: 2
  drain_timeout_minutes: 0

  router_control_enabled: true
  router_host: "192.168.0.1"
  router_ssh_port: 22
  router_ssh_user: "root"
  router_auth_method: "existing_key"
  router_ssh_key_name: "id_ed25519"
  router_ssh_key_path: ""
  router_ssh_password: ""
  router_firewall_rule: "mark_domains"
  router_status_interval_seconds: 10
schema:
  subscription_url: str
  config_index: int(0,)
  update_interval_hours: int(0,720)
  user_agent: str

  dual_slot_enabled: bool
  socks_tcp_a: port
  socks_tcp_b: port
  proxy_username: str?
  proxy_password: password?
  log_level: list(debug|info|warning|error|none)

  auto_checker_enabled: bool
  auto_switch_best_enabled: bool
  switching_preset: list(smooth|adaptive|forced)
  auto_switch_preferred_country: str?
  auto_switch_preferred_protocol: str?
  auto_switch_excluded: str
  auto_switch_min_ping_delta_ms: int(0,10000)
  auto_check_interval_seconds: int(10,86400)
  auto_best_check_interval_seconds: int(60,86400)
  auto_check_max_latency_ms: int(0,10000)
  auto_check_failures: int(1,100)
  auto_check_timeout_seconds: int(3,)
  latency_test_timeout_seconds: int(3,)
  latency_test_parallelism: int(0,32)
  primary_test_url: str
  secondary_test_url: str

  ui_port: port
  ui_sort: list(name-asc|name-desc|ping-asc|ping-desc|protocol-asc|protocol-desc)
  ui_protocol_filter: str
  ui_max_ping_ms: int(0,10000)
  ui_hide_unavailable: bool
  ui_hide_excluded: bool

  selector_control_enabled: bool
  selector_api_url: str
  selector_api_secret: password?
  selector_tag: str
  selector_status_interval_seconds: int(5,)
  drain_quiet_seconds: int(5,)
  drain_poll_interval_seconds: int(1,)
  drain_timeout_minutes: int(0,1440)

  router_control_enabled: bool
  router_host: str
  router_ssh_port: port
  router_ssh_user: str
  router_auth_method: list(existing_key|password|generate_key)
  router_ssh_key_name: str
  router_ssh_key_path: str?
  router_ssh_password: password?
  router_firewall_rule: str
  router_status_interval_seconds: int(5,)
